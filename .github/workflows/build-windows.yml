name: Build Windows portable packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        runtime: [win-x64, win-x86, win-arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish self-contained app
        run: dotnet publish .\OmniFetch.Windows.csproj --configuration Release --runtime ${{ matrix.runtime }} --self-contained true -p:PublishSingleFile=true -p:EnableCompressionInSingleFile=true --output .\publish\${{ matrix.runtime }}
      - name: Upload portable package
        uses: actions/upload-artifact@v4
        with:
          name: OmniFetch-${{ matrix.runtime }}
          path: publish/${{ matrix.runtime }}
